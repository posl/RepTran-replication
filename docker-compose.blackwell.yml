version: '3'
services:
  socrates:
    container_name: terry-blackwell
    tty: true
    image: reptran-blackwell
    build:
      context: ./
      dockerfile: Dockerfile_blackwell
    ports:
      - "8888:8888"
      - "6006:6006"
    volumes:
      - .:/src
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
